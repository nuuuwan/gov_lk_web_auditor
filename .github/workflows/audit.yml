name: Run Sri Lankan network audit

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      max_urls:
        description: "Maximum number of URLs to audit; leave empty for all URLs"
        required: false
        type: string
        default: ""
      create_pr:
        description: "Open a report pull request after a successful audit"
        required: false
        type: boolean
        default: true
      shards:
        description: "Parallel shards to split URLs across (1 = whole list on one runner)"
        required: false
        type: string
        default: "1"
      skip_browser:
        description: "Skip Chromium installation for local workflow smoke tests"
        required: false
        type: boolean
        default: false
      skip_artifacts:
        description: "Skip artifact upload for local workflow smoke tests"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sri-lanka-audit
  cancel-in-progress: false

jobs:
  setup:
    runs-on: [self-hosted, linux, sri-lanka]
    outputs:
      shards: ${{ steps.set.outputs.shards }}
      total: ${{ steps.set.outputs.total }}
    steps:
      - id: set
        run: |
          N="${{ inputs.shards }}"
          [ -z "$N" ] && N=1
          IDS=$(seq 0 $((N - 1)) | jq -R . | jq -cs 'map(tonumber)')
          echo "shards=$IDS" >> "$GITHUB_OUTPUT"
          echo "total=$N" >> "$GITHUB_OUTPUT"

  audit:
    needs: setup
    runs-on: [self-hosted, linux, sri-lanka]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked environment
        run: uv sync --locked

      - name: Install Playwright Chromium
        if: ${{ !inputs.skip_browser }}
        run: uv run playwright install chromium

      - name: Log vantage point
        run: |
          curl -s https://api.ipify.org; echo
          curl -s "http://ip-api.com/json/?fields=country,countryCode,org"; echo

      - name: Run audit pipeline
        env:
          MAX_URLS: ${{ inputs.max_urls }}
        run: |
          repo_root="$(pwd)"
          while [[ ! -f "$repo_root/pyproject.toml" && "$repo_root" != "/" ]]; do
            repo_root="$(dirname "$repo_root")"
          done
          cd "$repo_root"
          args=()
          if [[ -n "$MAX_URLS" ]]; then
            args+=(--max-urls "$MAX_URLS")
          fi
          args+=(--shard-index "${{ matrix.shard }}")
          args+=(--shard-total "${{ needs.setup.outputs.total }}")
          PYTHONPATH=. uv run python workflows/pipeline.py "${args[@]}"

      - name: Upload audit outputs
        if: ${{ always() && !inputs.skip_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ github.run_id }}-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            audit.output
            latest_audit_reports
            README.md

      - name: Open report pull request
        if: ${{ success() && needs.setup.outputs.total == '1' && (github.event_name == 'schedule' || inputs.create_pr) }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/audit-reports
          delete-branch: true
          add-paths: |
            README.md
            latest_audit_reports
          commit-message: "chore(audit): refresh audit reports"
          title: "chore(audit): refresh audit reports"
          body: |
            ## what changed

            Refresh the generated audit reports and README summary from the Sri Lankan self-hosted runner.

            ## verification

            Audit run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
